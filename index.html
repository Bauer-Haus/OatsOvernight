<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oats Tier List Pro</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-stone-100 selection:bg-amber-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- SUPABASE SETUP ---
    // ⚠️ REPLACE THESE WITH YOUR ACTUAL KEYS FROM SUPABASE ⚠️
    const supabaseUrl = https://pcaohcybtvcygutotlff.supabase.co;
    const supabaseKey = sb_publishable_5oTHg1o6a823jCd-93wepA_sM2q_Zws;
    const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

    // --- ICONS ---
    const TrophyIcon = ({ className }) => ( <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg> );
    const StarIcon = ({ className }) => ( <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg> );
    const SearchIcon = ({ className }) => ( <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg> );

    // --- TIER CONFIG ---
    const TIERS = [
      { id: 'S', points: 7, color: 'bg-red-500', text: 'text-white' },
      { id: 'A', points: 6, color: 'bg-orange-400', text: 'text-black' },
      { id: 'B', points: 5, color: 'bg-yellow-400', text: 'text-black' },
      { id: 'C', points: 4, color: 'bg-green-400', text: 'text-black' },
      { id: 'D', points: 3, color: 'bg-cyan-400', text: 'text-black' },
      { id: 'E', points: 2, color: 'bg-blue-400', text: 'text-white' },
      { id: 'F', points: 1, color: 'bg-purple-400', text: 'text-white' },
    ];

    const getTierPoints = (tierId) => TIERS.find(t => t.id === tierId)?.points || 0;
    
    // Calculates the average back to a letter grade, defaulting to F if missing
    const getAverageTier = (averagePoints) => {
      if (!averagePoints || isNaN(averagePoints)) return TIERS[TIERS.length - 1];
      return TIERS.find(t => t.points === Math.round(averagePoints)) || TIERS[TIERS.length - 1]; 
    };

    function App() {
      const [userId, setUserId] = useState(null);
      const [activeTab, setActiveTab] = useState('vote');
      const [searchQuery, setSearchQuery] = useState('');
      const [ratings, setRatings] = useState({});
      const [flavors, setFlavors] = useState([]);
      const [isLoading, setIsLoading] = useState(true);

      useEffect(() => {
        // 1. ANONYMOUS TRACKING SETUP
        let storedId = localStorage.getItem('oats_voter_id');
        if (!storedId) {
          // Fallback random ID generator for browsers that don't support crypto.randomUUID
          storedId = window.crypto?.randomUUID ? crypto.randomUUID() : Math.random().toString(36).substring(2, 15);
          localStorage.setItem('oats_voter_id', storedId);
        }
        setUserId(storedId);

        // 2. FETCH LIVE LEADERBOARD FROM SUPABASE
        const fetchLeaderboard = async () => {
          try {
            const { data, error } = await supabase
              .from('leaderboard')
              .select('*')
              .order('total_points', { ascending: false });
            
            if (error) throw error;
            if (data) setFlavors(data);
          } catch (err) {
            console.error("Error loading leaderboard:", err);
            // Fallback empty state so the app doesn't crash if keys are wrong
            setFlavors([]); 
          } finally {
            setIsLoading(false);
          }
        };

        fetchLeaderboard();
      }, []);

      const handleRate = async (flavorId, tierId) => {
        // Optimistically update the UI instantly so it feels snappy
        setRatings(prev => {
          const newRatings = { ...prev };
          if (newRatings[flavorId] === tierId) delete newRatings[flavorId];
          else newRatings[flavorId] = tierId;
          return newRatings;
        });

        // Send to Supabase
        const points = getTierPoints(tierId); 
        
        try {
          const { error } = await supabase
            .from('votes')
            .upsert({ 
              user_id: userId, 
              flavor_id: flavorId, 
              points: points 
            });

          if (error) throw error;
          
          // Optional: You could re-fetch the leaderboard here to get live updates, 
          // but avoiding it on every click keeps the app feeling faster and saves database reads.
          
        } catch (err) {
          console.error("Failed to save vote:", err);
          alert("Couldn't save your vote. Please check your connection.");
        }
      };

      // Combine database totals with any local session votes to show accurate progress bars
      const rankedFlavors = useMemo(() => {
        return flavors.map(flavor => {
          // If they voted this session, visually update their impact on the bar
          const sessionTier = ratings[flavor.id];
          const sessionPoints = sessionTier ? getTierPoints(sessionTier) : 0;
          
          const totalPoints = flavor.total_points + sessionPoints;
          const totalVotes = flavor.total_votes + (sessionTier ? 1 : 0);
          const average = totalVotes > 0 ? (totalPoints / totalVotes) : 0;
          
          return {
            ...flavor,
            displayPoints: totalPoints,
            displayVotes: totalVotes,
            avgTierData: getAverageTier(average)
          };
        }).sort((a, b) => b.displayPoints !== a.displayPoints ? b.displayPoints - a.displayPoints : a.name.localeCompare(b.name));
      }, [ratings, flavors]);

      const highestPoints = rankedFlavors[0]?.displayPoints || 1;
      const ratedCount = Object.keys(ratings).length;
      const filteredFlavors = flavors.filter(f => f.name.toLowerCase().includes(searchQuery.toLowerCase()));

      const getTrophyColor = (index) => {
        switch(index) {
          case 0: return 'text-yellow-400 fill-yellow-400 drop-shadow-lg scale-110';
          case 1: return 'text-slate-300 fill-slate-200 drop-shadow-md';
          case 2: return 'text-amber-700 fill-amber-700/60 drop-shadow-md';
          default: return 'text-stone-300';
        }
      };

      if (isLoading) {
        return (
          <div className="min-h-screen bg-stone-100 flex flex-col items-center justify-center font-sans">
            <div className="w-8 h-8 border-4 border-amber-200 border-t-amber-600 rounded-full animate-spin mb-4"></div>
            <p className="text-stone-500 font-bold animate-pulse">Loading Live Database...</p>
          </div>
        );
      }

      return (
        <div className="min-h-screen text-stone-900 font-sans pb-24">
          
          <header className="sticky top-0 z-30 backdrop-blur-xl bg-white/80 border-b border-stone-200/50 shadow-sm">
            <div className="max-w-3xl mx-auto px-4 py-4">
              <div className="flex flex-col sm:flex-row items-center justify-between gap-4">
                <h1 className="text-2xl font-black tracking-tight text-stone-800 flex items-center gap-2">
                  <span className="bg-amber-600 text-white px-2 py-1 rounded-lg shadow-sm">Oats</span> Tier List
                </h1>

                <div className="flex bg-stone-200/70 p-1 rounded-xl w-full sm:w-auto shadow-inner">
                  <button 
                    onClick={() => setActiveTab('vote')}
                    className={`flex-1 sm:px-6 py-2 rounded-lg font-bold text-sm transition-all duration-300 ${activeTab === 'vote' ? 'bg-white text-stone-800 shadow-sm' : 'text-stone-500 hover:text-stone-700'}`}
                  >
                    Rate Flavors
                  </button>
                  <button 
                    onClick={() => setActiveTab('leaderboard')}
                    className={`flex-1 sm:px-6 py-2 rounded-lg font-bold text-sm transition-all duration-300 ${activeTab === 'leaderboard' ? 'bg-white text-stone-800 shadow-sm' : 'text-stone-500 hover:text-stone-700'}`}
                  >
                    Leaderboard
                  </button>
                </div>
              </div>

              {activeTab === 'vote' && (
                <div className="mt-4 animate-in fade-in slide-in-from-top-2 duration-300">
                  <div className="flex justify-between text-xs font-bold text-stone-500 mb-1 uppercase tracking-wider">
                    <span>Your Ratings</span>
                    <span className={ratedCount === flavors.length ? 'text-amber-600' : ''}>{ratedCount} / {flavors.length}</span>
                  </div>
                  <div className="w-full bg-stone-200 rounded-full h-2 overflow-hidden shadow-inner">
                    <div 
                      className="bg-amber-500 h-full rounded-full transition-all duration-500 ease-out" 
                      style={{ width: `${flavors.length > 0 ? (ratedCount / flavors.length) * 100 : 0}%` }}
                    />
                  </div>
                </div>
              )}
            </div>
          </header>
          
          <main className="max-w-3xl mx-auto px-4 mt-8">
            
            {activeTab === 'leaderboard' && (
              <div className="animate-in fade-in slide-in-from-right-8 duration-500">
                <div className="mb-8 text-center">
                  <h2 className="text-3xl font-extrabold text-stone-800 tracking-tight">The Global Tier List</h2>
                  <p className="text-stone-500 mt-2">Live rankings aggregated from community votes!</p>
                </div>

                <div className="flex flex-col gap-3">
                  {rankedFlavors.map((flavor, index) => (
                    <div key={flavor.id} className="bg-white p-3 sm:p-4 rounded-2xl shadow-sm border border-stone-200 flex items-center gap-4 hover:shadow-md transition-shadow">
                      
                      <div className="w-10 sm:w-12 flex justify-center shrink-0">
                        {index < 3 ? (
                          <TrophyIcon className={`w-8 h-8 sm:w-10 sm:h-10 ${getTrophyColor(index)}`} />
                        ) : (
                          <span className="text-xl font-black text-stone-400">#{index + 1}</span>
                        )}
                      </div>

                      <div className={`w-12 h-12 shrink-0 rounded-xl flex items-center justify-center font-black text-2xl shadow-inner border border-black/5 ${flavor.avgTierData.color} ${flavor.avgTierData.text}`}>
                        {flavor.avgTierData.id}
                      </div>
                      
                      <div className="flex-1 min-w-0">
                        <h3 className="font-bold text-stone-800 text-base sm:text-lg truncate">{flavor.name}</h3>
                        <div className="text-xs font-semibold text-stone-500 mt-1 flex gap-2">
                          <span>{flavor.displayPoints} Pts</span> 
                          <span className="text-stone-300">•</span>
                          <span>{flavor.displayVotes} Votes</span>
                        </div>
                        <div className="w-full bg-stone-100 h-1.5 rounded-full mt-2 overflow-hidden">
                          <div 
                            className={`${flavor.avgTierData.color} h-full rounded-full`} 
                            style={{ width: `${Math.max(2, (flavor.displayPoints / highestPoints) * 100)}%` }}
                          />
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'vote' && (
              <div className="animate-in fade-in slide-in-from-left-8 duration-500">
                
                <div className="relative mb-8 shadow-sm rounded-2xl">
                  <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <SearchIcon className="h-5 w-5 text-stone-400" />
                  </div>
                  <input
                    type="text"
                    className="block w-full pl-11 pr-4 py-4 bg-white border border-stone-200 rounded-2xl text-stone-900 placeholder-stone-400 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent font-medium"
                    placeholder="Search for a flavor to rate..."
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                  />
                </div>

                {filteredFlavors.length === 0 && (
                  <div className="text-center py-12 text-stone-400 font-bold">
                    No flavors found matching "{searchQuery}"
                  </div>
                )}

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  {filteredFlavors.map((flavor) => (
                    <div key={flavor.id} className={`bg-white p-4 rounded-2xl border transition-all duration-300 ${ratings[flavor.id] ? 'border-amber-200 shadow-md bg-amber-50/10' : 'border-stone-200 shadow-sm hover:shadow-md'}`}>
                      <div className="flex justify-between items-start mb-4 h-12">
                        <h3 className="font-extrabold text-stone-800 pr-2 leading-tight">{flavor.name}</h3>
                        {ratings[flavor.id] && (
                          <span className="shrink-0 flex items-center gap-1 text-[10px] uppercase font-black tracking-wider text-amber-600 bg-amber-100 px-2 py-1 rounded-full shadow-sm">
                            <StarIcon className="w-3 h-3 fill-amber-600" /> Rated
                          </span>
                        )}
                      </div>
                      
                      <div className="grid grid-cols-7 gap-1 w-full mt-auto">
                        {TIERS.map((tier) => {
                          const isSelected = ratings[flavor.id] === tier.id;
                          return (
                            <button
                              key={tier.id}
                              onClick={() => handleRate(flavor.id, tier.id)}
                              className={`
                                aspect-square flex items-center justify-center font-black rounded-lg text-sm transition-all active:scale-90
                                ${isSelected 
                                  ? `${tier.color} ${tier.text} shadow-[inset_0_-2px_4px_rgba(0,0,0,0.3)] scale-105 z-10 ring-2 ring-offset-1 ring-stone-300` 
                                  : 'bg-stone-100 text-stone-400 hover:bg-stone-200 border border-stone-200/50'}
                              `}
                            >
                              {tier.id}
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
