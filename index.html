<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oats Tier List</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    // SVG Icons
    const TrophyIcon = ({ className }) => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
    );
    const StarIcon = ({ className }) => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
    );
    const ChevronDownIcon = ({ className }) => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m6 9 6 6 6-6"/></svg>
    );

    const TIERS = [
      { id: 'S', points: 7, color: 'bg-red-500', text: 'text-white' },
      { id: 'A', points: 6, color: 'bg-orange-400', text: 'text-black' },
      { id: 'B', points: 5, color: 'bg-yellow-400', text: 'text-black' },
      { id: 'C', points: 4, color: 'bg-green-400', text: 'text-black' },
      { id: 'D', points: 3, color: 'bg-cyan-400', text: 'text-black' },
      { id: 'E', points: 2, color: 'bg-blue-400', text: 'text-white' },
      { id: 'F', points: 1, color: 'bg-purple-400', text: 'text-white' },
    ];

    const getTierPoints = (tierId) => TIERS.find(t => t.id === tierId)?.points || 0;

    const getAverageTier = (averagePoints) => {
      const rounded = Math.round(averagePoints);
      return TIERS.find(t => t.points === rounded) || TIERS[TIERS.length - 1]; 
    };

    function App() {
      const [ratings, setRatings] = useState({});
      const [flavors, setFlavors] = useState([]);
      const [isLoading, setIsLoading] = useState(true);

      // Fetch flavors from the JSON file when the app loads
      useEffect(() => {
        fetch('flavors.json')
          .then(response => response.json())
          .then(data => {
            setFlavors(data);
            setIsLoading(false);
          })
          .catch(error => {
            console.error("Error loading flavors:", error);
            setIsLoading(false);
          });
      }, []);

      const handleRate = (flavorId, tierId) => {
        if (ratings[flavorId] === tierId) {
          const newRatings = { ...ratings };
          delete newRatings[flavorId];
          setRatings(newRatings);
        } else {
          setRatings(prev => ({ ...prev, [flavorId]: tierId }));
        }
      };

      const rankedFlavors = useMemo(() => {
        return flavors.map(flavor => {
          const userTier = ratings[flavor.id];
          const userPoints = userTier ? getTierPoints(userTier) : 0;
          
          const totalPoints = flavor.baseTotal + userPoints;
          const totalVotes = flavor.baseVotes + (userTier ? 1 : 0);
          const average = totalPoints / totalVotes;
          const avgTierData = getAverageTier(average);
          
          return {
            ...flavor,
            totalPoints,
            totalVotes,
            average: average.toFixed(1),
            avgTierData
          };
        }).sort((a, b) => b.totalPoints !== a.totalPoints 
          ? b.totalPoints - a.totalPoints 
          : a.name.localeCompare(b.name)
        );
      }, [ratings, flavors]);

      const highestPoints = rankedFlavors[0]?.totalPoints || 1;

      const getTrophyColor = (index) => {
        switch(index) {
          case 0: return 'text-yellow-400 fill-yellow-400 drop-shadow-md';
          case 1: return 'text-slate-300 fill-slate-200 drop-shadow-md';
          case 2: return 'text-amber-700 fill-amber-700/60 drop-shadow-md';
          default: return 'text-transparent';
        }
      };

      const handleScrollToVote = (e) => {
        e.preventDefault();
        const voteSection = document.getElementById('vote-section');
        if (voteSection) {
          voteSection.scrollIntoView({ behavior: 'smooth' });
        }
      };

      // Show a loading state while fetching the JSON
      if (isLoading) {
        return (
          <div className="min-h-screen bg-stone-50 flex flex-col items-center justify-center font-sans">
            <div className="w-8 h-8 border-4 border-amber-200 border-t-amber-600 rounded-full animate-spin mb-4"></div>
            <p className="text-stone-500 font-bold animate-pulse">Loading Leaderboard...</p>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-stone-50 text-stone-900 font-sans pb-20">
          <header className="bg-white border-b border-stone-200 py-4 px-4 sticky top-0 z-20 shadow-sm">
            <div className="max-w-2xl mx-auto flex items-center justify-between">
              <h1 className="text-xl sm:text-2xl font-black tracking-tight text-stone-800 flex items-center gap-2">
                <span className="text-amber-600">Oats</span> Tier List
              </h1>
              <a 
                href="#vote-section" 
                onClick={handleScrollToVote}
                className="text-sm font-bold text-amber-700 bg-amber-50 px-3 py-1.5 rounded-lg flex items-center gap-1 hover:bg-amber-100 transition-colors cursor-pointer"
              >
                Rate Yours <ChevronDownIcon className="w-4 h-4" />
              </a>
            </div>
          </header>
          
          <main className="max-w-2xl mx-auto px-4 mt-6">
            <section className="mb-16">
              <div className="mb-6">
                <h2 className="text-3xl font-extrabold text-stone-800">Global Leaderboard</h2>
                <p className="text-stone-500 mt-2">
                  Flavors ranked by total points. S-Tier awards 7 points, down to F-Tier awarding 1 point.
                </p>
              </div>

              <div className="flex flex-col gap-3">
                {rankedFlavors.map((flavor, index) => (
                  <div key={flavor.id} className="bg-white p-4 rounded-2xl shadow-sm border border-stone-100 flex items-center gap-3 sm:gap-4 relative overflow-hidden transition-all duration-300">
                    <div className="w-8 sm:w-12 flex justify-center shrink-0">
                      {index < 3 ? (
                        <TrophyIcon className={`w-8 h-8 sm:w-10 sm:h-10 ${getTrophyColor(index)}`} />
                      ) : (
                        <span className="text-xl sm:text-2xl font-black text-stone-300">#{index + 1}</span>
                      )}
                    </div>

                    <div className={`w-10 h-10 sm:w-12 sm:h-12 shrink-0 rounded-xl flex items-center justify-center font-black text-xl sm:text-2xl shadow-inner ${flavor.avgTierData.color} ${flavor.avgTierData.text}`}>
                      {flavor.avgTierData.id}
                    </div>
                    
                    <div className="flex-1 min-w-0">
                      <h3 className="font-bold text-stone-800 text-sm sm:text-lg truncate leading-tight">{flavor.name}</h3>
                      <div className="text-[11px] sm:text-sm font-medium text-stone-500 mt-1 flex flex-wrap items-center gap-x-2 gap-y-1">
                        <span className="text-stone-800 font-bold bg-stone-100 px-2 py-0.5 rounded-md">
                          {flavor.totalPoints} Pts
                        </span> 
                        <span className="text-stone-300 hidden sm:inline">•</span>
                        <span>{flavor.totalVotes} Votes</span>
                      </div>
                      <div className="w-full bg-stone-100 h-1.5 sm:h-2 rounded-full mt-2.5 overflow-hidden">
                        <div 
                          className={`${flavor.avgTierData.color} h-full rounded-full transition-all duration-1000 ease-out`} 
                          style={{ width: `${Math.max(2, (flavor.totalPoints / highestPoints) * 100)}%` }}
                        />
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </section>

            <div className="w-full h-px bg-gradient-to-r from-transparent via-stone-300 to-transparent my-8" />

            <section id="vote-section" className="scroll-mt-24">
              <div className="mb-6 text-center sm:text-left">
                <h2 className="text-2xl font-extrabold text-stone-800">Add Your Rankings</h2>
                <p className="text-stone-500 mt-1">
                  Select a tier for the flavors you've tried. Your votes instantly update the leaderboard above!
                </p>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                {flavors.map((flavor) => (
                  <div key={flavor.id} className="bg-white p-4 rounded-2xl shadow-sm border border-stone-200 transition-all duration-300 hover:shadow-md flex flex-col justify-between">
                    <div className="flex justify-between items-start mb-3">
                      <h3 className="font-bold text-stone-800 pr-2">{flavor.name}</h3>
                      {ratings[flavor.id] && (
                        <span className="shrink-0 flex items-center gap-1 text-[10px] uppercase font-bold tracking-wider text-amber-600 bg-amber-50 px-2 py-1 rounded-full">
                          <StarIcon className="w-3 h-3 fill-amber-600" /> Rated
                        </span>
                      )}
                    </div>
                    
                    <div className="grid grid-cols-7 gap-1 w-full mt-auto">
                      {TIERS.map((tier) => {
                        const isSelected = ratings[flavor.id] === tier.id;
                        return (
                          <button
                            key={tier.id}
                            onClick={() => handleRate(flavor.id, tier.id)}
                            className={`
                              aspect-[4/3] flex items-center justify-center font-black rounded-md text-sm sm:text-base transition-all active:scale-95
                              ${isSelected 
                                ? `${tier.color} ${tier.text} shadow-inner ring-2 ring-offset-1 ring-stone-400` 
                                : 'bg-stone-100 text-stone-400 hover:bg-stone-200'}
                            `}
                            title={`Rate as ${tier.id} Tier`}
                          >
                            {tier.id}
                          </button>
                        );
                      })}
                    </div>
                  </div>
                ))}
              </div>
            </section>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
